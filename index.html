function fmt(n, cur = true) {
  if (n === null || n === undefined || isNaN(n)) return "";
  const neg = n < 0; const a = Math.round(Math.abs(n));
  const s = String(a).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return (neg ? "-" : "") + (cur ? "$" : "") + s;
}
function fmtEUR(n) {
  const neg = n < 0; const a = Math.round(Math.abs(n));
  return (neg ? "-" : "") + String(a).replace(/\B(?=(\d{3})+(?!\d))/g, "\u00A0") + "\u00A0EUR";
}
function parseNum(s) {
  if (typeof s === "number") return s;
  if (!s) return 0;
  const c = String(s).replace(/[\s$]|COP|EUR/gi, "").replace(/\./g, "").replace(",", ".");
  const n = parseFloat(c); return isFinite(n) ? n : 0;
}
function fmtDate(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso || ""); }
function parseDate(s) {
  s = (s || "").trim(); if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = /^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/.exec(s); if (!m) return s;
  let y = m[3]; if (y.length === 2) y = "20" + y; return `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const accName = code => { const a = ACC[code]; return a ? a[S.lang] : ""; };
const pct = (x, d = 1) => (isFinite(x) ? (x * 100).toFixed(d).replace(".", S.lang === "es" ? "," : ".") + " %" : "–");

/* ---------------- ledger engine ---------------- */
function balances() {
  const m = {};
  for (const e of S.entries) {
    if (!e.amount) continue;
    if (ACC[e.dr]) { (m[e.dr] ||= { dr: 0, cr: 0, lines: [] }); m[e.dr].dr += e.amount; m[e.dr].lines.push({ side: "D", amt: e.amount, ref: e }); }
    if (ACC[e.cr]) { (m[e.cr] ||= { dr: 0, cr: 0, lines: [] }); m[e.cr].cr += e.amount; m[e.cr].lines.push({ side: "C", amt: e.amount, ref: e }); }
  }
  return m;
}
// balance in natural sense of the account's class (A,G,C positive debit; L,E,I positive credit)
function classBal(code, b) { const a = ACC[code]; const x = b[code]; if (!x) return 0; return ["A", "G", "C"].includes(a.cat) ? x.dr - x.cr : x.cr - x.dr; }
function figures() {
  const b = balances(); const sum = pred => Object.keys(b).filter(pred).reduce((s, c) => s + classBal(c, b), 0);
  const rev = sum(c => c.startsWith("41"));
  const otherInc = sum(c => c.startsWith("42"));
  const cogs = sum(c => c.startsWith("6") || c.startsWith("7"));
  const admin = sum(c => c.startsWith("51"));
  const sales = sum(c => c.startsWith("52"));
  const otherExp = sum(c => c.startsWith("53"));
  const taxExp = sum(c => c.startsWith("54"));
  const gross = rev - cogs, op = gross - admin - sales, pbt = op + otherInc - otherExp, net = pbt - taxExp;
  const nd100 = sum(c => ACC[c].flag === "nd100");
  const nd50 = sum(c => ACC[c].flag === "nd50") * 0.5;
  return { b, rev, otherInc, cogs, admin, sales, otherExp, taxExp, gross, op, pbt, net, nd100, nd50, totalIncome: rev + otherInc };
}

/* ---------------- tax engines ---------------- */
// Colombia: art. 240 ET (35 %), TTD art. 240 par. 6 ET (Ley 2277 de 2022) - simplified teaching version
function taxCO(f, t) {
  const DPARL = f.nd100 + f.nd50 + t.otherPlus;           // diferencias permanentes que aumentan la renta líquida
  const rlo = f.pbt + DPARL - t.otherMinus - t.incrngo;     // renta líquida ordinaria (simplificada)
  const comp = Math.min(Math.max(rlo, 0), t.losses);        // compensación de pérdidas fiscales (art. 147 ET)
  const rl = rlo - comp;
  const exUsed = Math.min(t.exempt + t.exemptOther, Math.max(rl, 0));
  const rlg = Math.max(rl - t.exempt - t.exemptOther, 0);   // renta líquida gravable
  const inr0 = rlg * 0.35;
  const dt = Math.min(t.credits, inr0);
  const INR = inr0 - dt;                                     // impuesto neto de renta
  const UD = f.pbt + DPARL - t.incrngo - t.vimpp - t.vngo - t.exempt - comp; // utilidad depurada
  const ID = INR;                                            // impuesto depurado (sin DTC ni IRP en este ejercicio)
  const TTD = UD > 0 ? ID / UD : NaN;
  const IA = UD > 0 && TTD < 0.15 ? UD * 0.15 - ID : 0;      // impuesto a adicionar
  const total = INR + IA;
  return { DPARL, rlo, comp, rl, exUsed, rlg, inr0, dt, INR, UD, ID, TTD, IA, total };
}
// Slovakia: zákon 595/2003 § 15 (10/21/24 %) and § 46b (minimum tax), periods starting in 2026
function skRate(revEUR) { return revEUR <= 100000 ? 0.10 : revEUR <= 5000000 ? 0.21 : 0.24; }
function skMin(revEUR) { return revEUR <= 50000 ? 340 : revEUR <= 250000 ? 960 : revEUR <= 500000 ? 1920 : revEUR <= 5000000 ? 3840 : 11520; }
function taxSK(f, t) {
  const fx = t.fx > 0 ? t.fx : 3550;
  const revEUR = f.totalIncome / fx;
  const baseEUR = (f.pbt + f.nd100 + f.nd50 + t.otherPlus - t.otherMinus - t.incrngo) / fx;
  const rate = skRate(revEUR), min = skMin(revEUR);
  const computed = Math.max(baseEUR, 0) * rate;
  const pay = Math.max(computed, min);
  const zone = min / rate;
  return { fx, revEUR, baseEUR, rate, min, computed, pay, zone, credit: Math.max(min - computed, 0) };
}

    else if (f === "dr" || f === "cr") { e[f] = inp.value.trim(); inp.classList.toggle("unknown", !!e[f] && !ACC[e[f]]); inp.nextElementSibling.textContent = accName(e[f]); }
    else if (f === "date") e.date = parseDate(inp.value);
    else e[f] = inp.value;
    S.isSample = false; save(); journalStatus();
  });
  body.addEventListener("focusout", ev => { const inp = ev.target; if (inp.dataset.f === "amount") { const v = parseNum(inp.value); inp.value = v ? fmt(v, false) : ""; } });
  body.addEventListener("keydown", ev => {
    const inp = ev.target; const f = inp.dataset && inp.dataset.f; if (!f) return;
    const tr_ = inp.closest("tr"); const idx = cols.indexOf(f);
    // Tab in the credit column jumps to the next line, adding a new one at the end
    if (ev.key === "Tab" && !ev.shiftKey && !ev.altKey && !ev.ctrlKey && !ev.metaKey && f === "cr") {
      ev.preventDefault();
      let nx = tr_.nextElementSibling; if (!nx) { addLine(); nx = body.lastElementChild; }
      nx.querySelector('[data-f="date"]').focus(); return;
    }
    if (ev.key !== "Enter") return;
    ev.preventDefault();
    if (idx < cols.length - 1) { tr_.querySelector(`[data-f="${cols[idx + 1]}"]`).focus(); return; }
    let next = tr_.nextElementSibling; if (!next) { addLine(); next = body.lastElementChild; }
    next.querySelector('[data-f="date"]').focus();
  });
  body.addEventListener("click", ev => {
    const id = ev.target.dataset?.del; if (!id) return;
    S.entries = S.entries.filter(e => e.id !== id); if (!S.entries.length) S.entries.push(blank());
    S.isSample = false; save(); render();
  });
  document.getElementById("j-add").onclick = () => { addLine(); document.getElementById("j-body").lastElementChild.querySelector("input").focus(); };
  document.getElementById("j-sample").onclick = () => { S.entries = sampleEntries(); S.isSample = true; save(); render(); };
  document.getElementById("j-student").onclick = () => { S.entries = sampleEntries().map(e => ({ ...e, dr: "", cr: "" })); S.isSample = false; save(); render(); msg(tr("Complete las cuentas débito y crédito de cada línea.", "Fill in the debit and credit accounts of each line.")); };
  document.getElementById("j-copy").onclick = async () => {
    const csv = ["fecha;doc;concepto;valor;debito;credito", ...S.entries.map(e => [fmtDate(e.date), e.doc, '"' + (e.desc || "").replace(/"/g, '""') + '"', e.amount || 0, e.dr, e.cr].join(";"))].join("\n");
    try { await navigator.clipboard.writeText(csv); msg(tr("CSV copiado al portapapeles.", "CSV copied to the clipboard.")); }
    catch { msg(tr("El navegador no permitió copiar.", "The browser did not allow copying.")); }
  };
  document.getElementById("j-file").onchange = ev => {
    const file = ev.target.files[0]; if (!file) return; const rd = new FileReader();
    rd.onload = () => {
      const lines = String(rd.result).replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim());
      const start = /fecha|date|no;/i.test(lines[0]) ? 1 : 0; const out = [];
      for (let i = start; i < lines.length; i++) {
        const p = lines[i].match(/("([^"]|"")*"|[^;]*)(;|$)/g).map(x => x.replace(/;$/, "").replace(/^"|"$/g, "").replace(/""/g, '"'));
        if (p.length < 6) continue;
        out.push({ id: nid(), date: parseDate(p[0]), doc: p[1], desc: p[2], amount: parseNum(p[3]), dr: p[4].trim(), cr: p[5].trim() });
      }
      if (out.length) { S.entries = out; S.isSample = false; save(); render(); msg(out.length + tr(" líneas importadas.", " lines imported.")); }
      else msg(tr("No se encontraron líneas válidas (formato: fecha;doc;concepto;valor;debito;credito).", "No valid lines found (format: date;doc;description;amount;debit;credit)."));
    };
    rd.readAsText(file, "utf-8");
  };
  // two-step clear (no confirm dialogs in the viewer)
  document.getElementById("j-clear").onclick = () => {
    document.getElementById("j-clear-wrap").innerHTML = `<button class="btn warn" id="j-clear-yes">${tr("Sí, vaciar todo", "Yes, clear all")}</button> <button class="btn" id="j-clear-no">${tr("Cancelar", "Cancel")}</button>`;
    document.getElementById("j-clear-yes").onclick = () => { S.entries = [blank()]; S.isSample = false; save(); render(); };
    document.getElementById("j-clear-no").onclick = () => render();
  };
}

function curve(f, t) {
  const W = 760, H = 280, pad = { l: 70, r: 16, t: 14, b: 48 };
  const base = Math.max(Math.abs(f.pbt), 10000000);
  const xs = [], N = 60; for (let i = 0; i <= N; i++) xs.push(-0.5 * base + (2 * base) * i / N);
  const coT = x => taxCO({ ...f, pbt: x }, t).total;
  const skT = x => { const s = taxSK({ ...f, pbt: x }, t); return s.pay * s.fx; };
  const ysC = xs.map(coT), ysS = xs.map(skT); const ymax = Math.max(...ysC, ...ysS, 1) * 1.08;
  const X = x => pad.l + (x - xs[0]) / (xs[N] - xs[0]) * (W - pad.l - pad.r);
  const Y = y => H - pad.b - y / ymax * (H - pad.t - pad.b);
  const path = ys => xs.map((x, i) => (i ? "L" : "M") + X(x).toFixed(1) + " " + Y(ys[i]).toFixed(1)).join(" ");
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(k => k * ymax);
  const xt = [xs[0], 0, base * 0.5, base, base * 1.5];
  const short = v => { if (Math.abs(v) < 1) return "0"; const m = v / 1e6; return (Math.abs(m) >= 1 ? m.toFixed(0) : m.toFixed(1)).replace(".", ",") + " M"; };
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px;max-width:100%" role="img" aria-label="${tr("Impuesto según utilidad", "Tax by profit")}">
    ${ticks.map(v => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pad.l - 8}" y="${Y(v) + 4}" text-anchor="end">${short(v)}</text>`).join("")}

  if (el.id === "q-peek") { S.quiz.peek = !S.quiz.peek; return render(); }
  if (el.id === "q-next") { const st = S.quiz; st.i++; st.answered = null;
    if (st.i < st.ids.length) st.perm = shuffle(BANK[st.ids[st.i]].o.es.map((_, k) => k));
    else if (st.ids.length >= 5) { const b = store.get("best", {}); const val = `${st.score}/${st.ids.length}`; const old = b[st.topic]; if (!old || st.score >= +old.split("/")[0]) { b[st.topic] = val; store.set("best", b); } }

});

{ t: { es: "Marco contable", en: "Accounting framework" },
  b: {
   es: `<p>La Ley 1314 de 2009 adoptó las normas internacionales; el Decreto Único Reglamentario 2420 de 2015 las organiza en tres grupos. El Consejo Técnico de la Contaduría Pública (CTCP) orienta su aplicación y la Superintendencia de Sociedades recibe y publica los estados financieros de las sociedades que supervisa.</p>
   <ul>
    <li><b>Grupo 1, NIIF plenas:</b> emisores de valores, entidades de interés público y entidades con más de 200 trabajadores o activos superiores a 30 000 SMMLV que además cumplan un vínculo (matriz o subordinada extranjera que aplique NIIF, grupo colombiano que aplique NIIF, o importaciones o exportaciones superiores al 50 %).</li>
    <li><b>Grupo 2, NIIF para las pymes:</b> el grupo residual, donde está la mayoría de las sociedades medianas y pequeñas.</li>
    <li><b>Grupo 3, contabilidad simplificada:</b> microempresas que cumplen las seis condiciones del Decreto 1670 de 2021 (vigente desde el 1.1.2023). Topes de ingresos (Decreto 957 de 2019): manufactura ≤ 23 563 UVT; servicios ≤ 32 988 UVT; comercio ≤ 44 769 UVT.</li>
   </ul>
   <p><b>El PUC.</b> El Decreto 2650 de 1993 estructura el plan en clases: 1 Activo, 2 Pasivo, 3 Patrimonio, 4 Ingresos, 5 Gastos, 6 Costos de ventas, 7 Costos de producción, 8 y 9 cuentas de orden. Según el CTCP, las entidades bajo los marcos NIIF pueden definir su propio catálogo; el PUC sigue siendo la referencia más usada, y los supervisores pueden imponer catálogos propios. Las subcuentas del IVA (generado, descontable) no son códigos oficiales: el decreto deja abiertas las subcuentas 240801 a 240898, y la división es práctica de software y de texto.</p>
   <p><b>Revisor fiscal.</b> Obligatorio cuando los activos brutos al 31 de diciembre del año anterior son ≥ 5 000 SMMLV o los ingresos brutos del año anterior ≥ 3 000 SMMLV (Ley 43 de 1990, art. 13 par. 2), y siempre en las sociedades por acciones del Código de Comercio y las sucursales extranjeras. Una S.A.S. lo necesita solo por umbral, ley especial o estatutos. SMMLV 2026: $1.750.905.</p>
   <p><b>Comparación.</b> En Eslovaquia la mayoría de las sociedades lleva contabilidad según la normativa local (Ley 431/2002 y medidas del Ministerio de Finanzas, con un plan de cuentas marco obligatorio). La diferencia práctica: allá el plan de cuentas es una norma; en Colombia, para las sociedades bajo NIIF, es una referencia.</p>`,
   en: `<p>Law 1314 of 2009 adopted international standards; the Single Regulatory Decree 2420 of 2015 sorts them into three groups. The Technical Council of Public Accounting (CTCP) guides application, and the Superintendence of Companies collects and publishes the financial statements of the companies it supervises.</p>
   <ul>
    <li><b>Group 1, full IFRS:</b> securities issuers, public-interest entities, and entities with more than 200 workers or assets above 30,000 SMMLV that also have a link (foreign IFRS parent or subsidiary, Colombian IFRS group, or imports or exports above 50 %).</li>
    <li><b>Group 2, IFRS for SMEs:</b> the residual group, home to most medium and small companies.</li>
    <li><b>Group 3, simplified accounting:</b> micro-enterprises meeting all six conditions of Decree 1670 of 2021 (in force since 1.1.2023). Revenue caps (Decree 957 of 2019): manufacturing ≤ 23,563 UVT; services ≤ 32,988 UVT; trade ≤ 44,769 UVT.</li>
   </ul>
   <p><b>The PUC.</b> Decree 2650 of 1993 structures the chart by class: 1 Assets, 2 Liabilities, 3 Equity, 4 Income, 5 Expenses, 6 Cost of sales, 7 Production costs, 8 and 9 memorandum accounts. According to the CTCP, entities under the IFRS frameworks may define their own chart; the PUC remains the most used reference, and supervisors may impose their own catalogues. The VAT sub-accounts (output, input) are not official codes: the decree leaves sub-accounts 240801 to 240898 open, and the split is software and textbook practice.</p>
   <p><b>Revisor fiscal (statutory auditor).</b> Mandatory when gross assets at 31 December of the prior year are ≥ 5,000 SMMLV or prior-year gross income ≥ 3,000 SMMLV (Law 43 of 1990, art. 13 para. 2), and always for Commercial Code joint-stock companies and foreign branches. An S.A.S. needs one only by threshold, special law or bylaws. SMMLV 2026: COP 1,750,905.</p>
   <p><b>Comparison.</b> In Slovakia most companies keep accounts under local GAAP (Act 431/2002 and Ministry of Finance measures, with a mandatory framework chart of accounts). The practical difference: there the chart is a rule; in Colombia, for IFRS companies, it is a reference.</p>` },

    <li>Realización y causalidad: arts. 105 y 107 ET (necesidad, relación de causalidad y proporcionalidad).</li>
    <li>Impuestos pagados: deducibles al 100 %, salvo el de renta (art. 115); el ICA es deducible al 100 % y ya no existe la opción de descuento del 50 %; el GMF es deducible al 50 %.</li>
    <li>Depreciación fiscal: tasa contable con tope (art. 137): edificaciones 2,22 %; maquinaria, muebles y vehículos terrestres 10 %; equipo de cómputo y comunicación 20 %.</li>
    <li>Subcapitalización: intereses con vinculados deducibles hasta una deuda promedio de 2 veces el patrimonio líquido del año anterior (art. 118-1).</li>
    <li>Pérdidas fiscales: 12 periodos gravables, sin tope porcentual (art. 147).</li>
    <li>Renta presuntiva: 0 % desde el año gravable 2021 (art. 188).</li>
   </ul>
   <p><b>Comparación con Eslovaquia.</b> Allá la tarifa depende del tamaño (10 % hasta 100 000 EUR de ingresos, 21 % hasta 5 millones, 24 % por encima), las pérdidas se compensan en 5 años y, salvo los microcontribuyentes, hasta el 50 % de la base de cada año; además rige un impuesto mínimo fijo.</p>`,
   en: `<p><b>General rate: 35 %</b> (ET art. 240, as amended by Law 2277 of 2022). Surcharges and special rates:</p>
   <ul>
    <li>Financial institutions: +5 points (40 %) in tax years 2023 to 2027 if taxable income is ≥ 120,000 UVT, with a 100 % advance payment (para. 2). The Constitutional Court upheld it also for insurers and stockbrokers (C-196/26).</li>
    <li>Coal and oil: extra points depending on international prices (para. 3); hydroelectric generation: +3 points until 2026 (para. 4).</li>
    <li>Others: 9 % state monopolies; 15 % new hotels and ecotourism; 15 % publishers; industrial free-trade-zone users 20 % on export income (art. 240-1); ZESE with a temporary reduced rate.</li>
   </ul>
   <p><b>From accounting profit to taxable income.</b> The base starts from IFRS accounts (ET art. 21-1); differences are documented in the tax reconciliation (ET art. 772-1), reported on <b>form 2516</b> when gross tax income is ≥ 45,000 UVT and, since Resolution 246 of 2025, also by companies in consolidating groups.</p>
   <ul>
    <li>Realisation and causality: ET arts. 105 and 107 (necessity, causal link and proportionality).</li>
    <li>Taxes paid: 100 % deductible except income tax (art. 115); ICA is 100 % deductible and the old 50 % credit option is gone; GMF is 50 % deductible.</li>
    <li>Tax depreciation: book rate capped (art. 137): buildings 2.22 %; machinery, furniture and land vehicles 10 %; computers and communication equipment 20 %.</li>
    <li>Thin capitalisation: interest on related-party debt deductible up to average debt of 2 times prior-year net equity (art. 118-1).</li>
    <li>Tax losses: 12 tax periods, no percentage cap (art. 147).</li>
    <li>Presumptive income: 0 % since tax year 2021 (art. 188).</li>
   </ul>
   <p><b>Slovak comparison.</b> There the rate depends on size (10 % up to EUR 100,000 revenue, 21 % up to 5 million, 24 % above), losses are carried forward 5 years and, except for micro taxpayers, up to 50 % of each year's base; a fixed minimum tax also applies.</p>` },
  src: [["ET art. 240", ET("10")], ["ET arts. 105-115", ET("04")], ["ET arts. 118-1 y 137", ET("05")], ["ET art. 147", ET("06")], ["ET art. 188", ET("07")], ["DIAN: conciliación fiscal AG 2025", "https://www.dian.gov.co/Prensa/Paginas/NG-Publicados-prevalidadores-para-reporte-de-conciliacion-fiscal-AG-2025.aspx"], ["INCP: C-196/26", "https://incp.org.co/publicaciones/infoincp-publicaciones/impuestos/2026/07/se-declaro-exequible-la-sobretasa-del-5-aplicable-a-empresas-del-sector-asegurador-y-bursatil/"]] },

{ t: { es: "Tasa de tributación depurada (TTD)", en: "Adjusted tax rate (TTD)" },
  b: {
   es: `<p>La Ley 2277 de 2022 añadió el parágrafo 6 al art. 240 ET: el impuesto de los contribuyentes del art. 240 no puede ser inferior al 15 % de la utilidad depurada. En la práctica se la llama también tasa mínima de tributación (TMT).</p>
   <ul>
    <li><b>TTD = ID / UD</b></li>
    <li><b>ID = INR + DTC − IRP</b>: impuesto neto de renta, más descuentos por tratados y art. 254, menos el impuesto por rentas pasivas de entidades controladas del exterior.</li>
    <li><b>UD = UC + DPARL − INCRNGO − VIMPP − VNGO − RE − C</b>: utilidad contable antes de impuestos, más diferencias permanentes que aumentan la renta líquida, menos ingresos no constitutivos de renta, método de participación, ganancia ocasional neta, ciertas rentas exentas (tratados y CAN, régimen CHC, art. 235-2 num. 4 a) y b) y num. 7) y compensaciones.</li>
    <li>Si la TTD es menor de 15 %: <b>IA = UD × 15 % − ID</b>. Los grupos que consolidan calculan una TTD del grupo y reparten el impuesto a adicionar.</li>
   </ul>
   <p><b>No aplica</b> a entidades extranjeras sin residencia, ZESE mientras su tarifa es 0 %, ZOMAC, hoteles y editoriales de los par. 5 y 7 (salvo que deban presentar informe país por país), monopolios del par. 1, contratos de concesión del art. 32, ni cuando la UD es ≤ 0.</p>
   <p><b>Jurisprudencia.</b> La Corte Constitucional la declaró exequible (C-219/24 y C-488/24). El Consejo de Estado (Sección Cuarta, 23.7.2026, exp. 28920) mantuvo que puede aplicarse aunque haya pérdida contable si la UD es positiva, y anuló la tesis de la DIAN según la cual el impuesto a adicionar reduce el cálculo de dividendos no gravados del art. 49.</p>
   <p><b>Relación con el Pilar Dos.</b> Misma tasa y base contable, pero distinto alcance: la TTD llega a casi todos los contribuyentes del art. 240, sin umbral de tamaño ni exclusión por sustancia. Desde enero de 2026 el Pilar Dos incluye además el paquete «side-by-side» de la OCDE (grupos con matriz en jurisdicciones calificadas fuera de IIR y UTPR; puerto seguro para incentivos basados en sustancia). Colombia no había adoptado reglas GloBE a octubre de 2026.</p>`,
   en: `<p>Law 2277 of 2022 added paragraph 6 to ET art. 240: the tax of art. 240 taxpayers cannot be lower than 15 % of the adjusted profit (utilidad depurada). Practitioners also call it the minimum tax rate (tasa mínima de tributación, TMT).</p>
   <ul>
    <li><b>TTD = ID / UD</b></li>
    <li><b>ID = INR + DTC − IRP</b>: net income tax, plus treaty and art. 254 credits, minus tax on passive income of controlled foreign entities.</li>
    <li><b>UD = UC + DPARL − INCRNGO − VIMPP − VNGO − RE − C</b>: accounting profit before tax, plus permanent differences that increase taxable income, minus non-taxable income, equity-method income, net occasional gains, certain exempt income (treaty and Andean Community, CHC regime, art. 235-2 no. 4 a) and b) and no. 7) and loss offsets.</li>
    <li>If the TTD is below 15 %: <b>IA = UD × 15 % − ID</b>. Consolidating groups compute a group TTD and allocate the top-up.</li>
   </ul>
   <p><b>Does not apply</b> to non-resident foreign entities, ZESE while their rate is 0 %, ZOMAC, hotels and publishers under paras. 5 and 7 (unless they must file country-by-country reports), para. 1 monopolies, art. 32 concession contracts, or when UD is ≤ 0.</p>
   <p><b>Case law.</b> The Constitutional Court upheld it (C-219/24 and C-488/24). The Council of State (Fourth Section, 23.7.2026, file 28920) held that it can apply despite an accounting loss if UD is positive, and annulled the DIAN view that the top-up reduces the art. 49 non-taxed dividend computation.</p>
   <p><b>Relation to Pillar Two.</b> Same rate and book base, different scope: the TTD reaches almost all art. 240 taxpayers, with no size threshold and no substance carve-out. Since January 2026 Pillar Two also includes the OECD side-by-side package (groups with a parent in a qualifying jurisdiction outside IIR and UTPR; safe harbour for substance-based incentives). Colombia had not adopted GloBE rules as of October 2026.</p>` },
  src: [["ET art. 240 par. 6", ET("10")], ["Consejo de Estado, exp. 28920, 23.7.2026", "https://normograma.dian.gov.co/dian/compilacion/docs/11001-03-27-000-2024-00037-00(28920)_20260723.htm"], ["Corte Constitucional C-488/24", "https://www.corteconstitucional.gov.co/relatoria/2024/C-488-24.htm"]] },

{ t: { es: "Dividendos", en: "Dividends" },
  b: {
   es: `<p>El art. 49 ET determina qué parte de la utilidad se puede repartir como no gravada: en esencia, la renta líquida gravable más las ganancias ocasionales, menos el impuesto básico, más los dividendos no gravados recibidos. Lo que excede esa cifra se reparte como gravado.</p>
   <div class="scroll"><table><thead><tr><th>Beneficiario</th><th>Utilidades que ya tributaron</th><th>Utilidades que no tributaron</th></tr></thead><tbody>
   <tr><td>Persona natural residente</td><td>Se suman a la base general (tarifas del art. 241); descuento del 19 % sobre lo que exceda 1 090 UVT; retención del 15 % sobre ese exceso (arts. 242 y 254-1)</td><td>Primero a la tarifa del art. 240 (35 %), luego el régimen general</td></tr>
   <tr><td>Sociedad nacional</td><td>Retención del 10 %, solo en la primera sociedad que recibe, trasladable al beneficiario final (art. 242-1)</td><td>35 %, luego 10 %</td></tr>
   <tr><td>No residente</td><td>20 % (art. 245)</td><td>35 %, luego 20 % sobre el resto</td></tr>
   </tbody></table></div>
   <p><b>Comparación.</b> En Estonia y Letonia el impuesto de la sociedad se causa precisamente al distribuir; en Colombia y Eslovaquia la sociedad tributa sobre la utilidad anual y el dividendo tiene un segundo nivel.</p>`,
   en: `<p>ET art. 49 determines which part of the profit can be distributed tax-free: essentially taxable income plus occasional gains, minus basic tax, plus non-taxed dividends received. Anything above that is distributed as taxed.</p>
   <div class="scroll"><table><thead><tr><th>Recipient</th><th>Profits already taxed</th><th>Profits not taxed</th></tr></thead><tbody>
   <tr><td>Resident individual</td><td>Added to the general base (art. 241 rates); 19 % credit on the amount above 1,090 UVT; 15 % withholding on that excess (arts. 242, 254-1)</td><td>First at the art. 240 rate (35 %), then the general regime</td></tr>
   <tr><td>Colombian company</td><td>10 % withholding, only at the first receiving company, passed on to the final beneficiary (art. 242-1)</td><td>35 %, then 10 %</td></tr>
   <tr><td>Non-resident</td><td>20 % (art. 245)</td><td>35 %, then 20 % on the remainder</td></tr>
   </tbody></table></div>
   <p><b>Comparison.</b> In Estonia and Latvia the company tax arises precisely on distribution; in Colombia and Slovakia the company pays on annual profit and the dividend has a second layer.</p>` },
  src: [["ET art. 49", ET("02")], ["ET arts. 242, 242-1, 245", ET("10")]] },

{ t: { es: "Otros impuestos y retenciones", en: "Other taxes and withholding" },
  b: {
   es: `<ul>
    <li><b>IVA:</b> 19 % general y 5 % reducido (arts. 468 y 468-1 ET). En el libro diario se separa el IVA generado y el descontable dentro de la cuenta 2408.</li>
    <li><b>ICA:</b> impuesto municipal sobre ingresos brutos. La Ley 14 de 1983 fija rangos de 2 a 7 por mil para la industria y de 2 a 10 por mil para comercio y servicios; Bogotá aplica hoy aproximadamente de 4 a 14 por mil y aprobó una reforma para 2027. Es deducible al 100 % en renta.</li>
    <li><b>GMF:</b> 4 por mil sobre los movimientos financieros (art. 872 ET), deducible al 50 % (art. 115). Eslovaquia introdujo en 2025 un impuesto parecido sobre los pagos de las empresas.</li>
    <li><b>Retención en la fuente:</b> las personas jurídicas son agentes de retención. Desde el Decreto 572 de 2025 las bases bajaron: compras 10 UVT (2,5 % para declarantes), servicios 2 UVT (4 % general); honorarios a personas jurídicas 11 %; arrendamiento de inmuebles 3,5 %. El Consejo de Estado suspendió parte del decreto entre el 8 de mayo y el 30 de junio de 2026 y la suspensión se revocó con efectos desde el 1 de julio. Lo retenido se registra en la cuenta 2365 por el agente y en la 1355 por quien sufre la retención.</li>
    <li><b>Impuesto al patrimonio:</b> permanente solo para personas naturales (art. 292-3, umbral 72 000 UVT). En 2026 hubo además un impuesto extraordinario para personas jurídicas con patrimonio líquido ≥ 200 000 UVT al 1 de marzo de 2026 (Decreto Legislativo 173, en el marco de la emergencia invernal), del 0,5 % general y 1,6 % para el sector financiero y extractivo; su control de constitucionalidad seguía pendiente a mediados de 2026.</li>
    <li><b>Presencia económica significativa:</b> no residentes con interacción sistemática con el mercado colombiano e ingresos ≥ 31 300 UVT pueden optar por pagar el 3 % de los ingresos brutos (art. 20-3 ET).</li>
   </ul>`,
   en: `<ul>
    <li><b>VAT (IVA):</b> 19 % standard and 5 % reduced (ET arts. 468, 468-1). In the journal, output and input VAT are separated within account 2408.</li>
    <li><b>ICA:</b> municipal tax on gross income. Law 14 of 1983 sets ranges of 2 to 7 per mil for industry and 2 to 10 per mil for trade and services; Bogotá currently applies roughly 4 to 14 per mil and approved a reform for 2027. 100 % deductible for income tax.</li>
    <li><b>GMF:</b> 4 per mil on financial movements (ET art. 872), 50 % deductible (art. 115). Slovakia introduced a similar tax on business payments in 2025.</li>
    <li><b>Withholding at source:</b> legal entities are withholding agents. Since Decree 572 of 2025 the thresholds are lower: purchases 10 UVT (2.5 % for filers), services 2 UVT (4 % general); fees paid to legal entities 11 %; real estate rent 3.5 %. The Council of State suspended part of the decree between 8 May and 30 June 2026 and lifted the suspension from 1 July. The withholding agent records it in account 2365, the withheld party in 1355.</li>
    <li><b>Wealth tax:</b> permanent only for individuals (art. 292-3, threshold 72,000 UVT). In 2026 there was also an extraordinary tax on legal entities with net equity ≥ 200,000 UVT on 1 March 2026 (Legislative Decree 173, under the rainy-season emergency), at 0.5 % generally and 1.6 % for the financial and extractive sectors; its constitutional review was still pending in mid-2026.</li>
    <li><b>Significant economic presence:</b> non-residents with systematic interaction with the Colombian market and income ≥ 31,300 UVT may opt to pay 3 % of gross income (ET art. 20-3).</li>
   </ul>` },
  src: [["ET arts. 468 y 468-1", ET("19")], ["ET art. 872", ET("35")], ["DIAN Oficio 9041 de 2026", "https://normograma.dian.gov.co/dian/compilacion/docs/oficio_dian_9041_2026.htm"], ["Siigo: tabla de retención 2026", "https://www.siigo.com/blog/tabla-de-retencion-en-la-fuente"], ["Crowe: ICA Bogotá", "https://www.crowe.com/co/news/reconfiguracion-del-impuesto-de-industria-y-comercio-en-bogota"]] },

{ t: { es: "Régimen SIMPLE", en: "SIMPLE regime" },
  b: {
   es: `<p>Régimen opcional que integra renta, ICA y otros impuestos en un pago con tarifas sobre ingresos brutos (arts. 903 a 916 ET). Pueden optar personas naturales y sociedades cuyos socios sean personas naturales residentes, con ingresos brutos del año anterior inferiores a 100 000 UVT.</p>
   <div class="scroll"><table><thead><tr><th>Actividad</th><th>0-6 000 UVT</th><th>6 000-15 000</th><th>15 000-30 000</th><th>30 000-100 000</th></tr></thead><tbody>
   <tr><td>Tiendas pequeñas, minimercados</td><td class="num">1,2 %</td><td class="num">2,8 %</td><td class="num">4,4 %</td><td class="num">5,6 %</td></tr>
   <tr><td>Comercio e industria</td><td class="num">1,6 %</td><td class="num">2,0 %</td><td class="num">3,5 %</td><td class="num">4,5 %</td></tr>
   <tr><td>Expendio de comidas y transporte</td><td class="num">3,1 %</td><td class="num">3,4 %</td><td class="num">4,0 %</td><td class="num">4,5 %</td></tr>
   <tr><td>Profesiones liberales</td><td class="num">5,9 %</td><td class="num">7,3 %</td><td class="num">12 %</td><td class="num">14,5 %</td></tr>
   </tbody></table></div>
   <p>Comparación: Eslovaquia no tiene un régimen integrado para sociedades; la tarifa del 10 % para sociedades con ingresos de hasta 100 000 EUR cumple en parte esa función.</p>`,
   en: `<p>Optional regime that merges income tax, ICA and other taxes into one payment at rates on gross income (ET arts. 903 to 916). Individuals and companies whose partners are resident individuals may opt in, with prior-year gross income below 100,000 UVT.</p>
   <div class="scroll"><table><thead><tr><th>Activity</th><th>0-6,000 UVT</th><th>6,000-15,000</th><th>15,000-30,000</th><th>30,000-100,000</th></tr></thead><tbody>
   <tr><td>Small shops, mini-markets</td><td class="num">1.2 %</td><td class="num">2.8 %</td><td class="num">4.4 %</td><td class="num">5.6 %</td></tr>
   <tr><td>Trade and industry</td><td class="num">1.6 %</td><td class="num">2.0 %</td><td class="num">3.5 %</td><td class="num">4.5 %</td></tr>
   <tr><td>Food outlets and transport</td><td class="num">3.1 %</td><td class="num">3.4 %</td><td class="num">4.0 %</td><td class="num">4.5 %</td></tr>
   <tr><td>Liberal professions</td><td class="num">5.9 %</td><td class="num">7.3 %</td><td class="num">12 %</td><td class="num">14.5 %</td></tr>
   </tbody></table></div>
   <p>Comparison: Slovakia has no integrated regime for companies; the 10 % rate for companies with revenue up to EUR 100,000 partly plays that role.</p>` },
  src: [["ET arts. 903-916", ET("36")]] },

{ t: { es: "Cumplimiento y calendario", en: "Compliance and calendar" },
  b: {
   es: `<ul>
    <li><b>Formulario 110:</b> declaración de renta de personas jurídicas. Para el año gravable 2025 (presentado en 2026) los plazos dependen del último dígito del NIT. Grandes contribuyentes: primera cuota en febrero, declaración y segunda cuota en abril, tercera cuota en junio. Demás sociedades: declaración y 50 % en mayo, segunda cuota en julio.</li>
    <li><b>Anticipo:</b> 75 % del impuesto neto (o del promedio de dos años) menos las retenciones; 25 % el primer año y 50 % el segundo (art. 807 ET).</li>
    <li><b>Información exógena:</b> reporte anual de terceros a la DIAN.</li>
    <li><b>Factura electrónica</b> obligatoria, documento soporte para compras a no obligados a facturar, nómina electrónica y RADIAN para facturas como título valor.</li>
    <li><b>Formato 2516</b> de conciliación fiscal, antes de la declaración.</li>
   </ul>
   <p><b>Comparación.</b> En Eslovaquia la declaración del impuesto de sociedades vence tres meses después del cierre (con posible prórroga), los anticipos dependen del impuesto del año anterior y la factura electrónica entre empresas será obligatoria desde el 1 de enero de 2027.</p>`,
   en: `<ul>
    <li><b>Form 110:</b> corporate income tax return. For tax year 2025 (filed in 2026) deadlines depend on the last digit of the tax ID (NIT). Large taxpayers: first instalment in February, return and second instalment in April, third in June. Other companies: return and 50 % in May, second instalment in July.</li>
    <li><b>Advance payment:</b> 75 % of net tax (or the two-year average) minus withholdings; 25 % in the first year and 50 % in the second (ET art. 807).</li>
    <li><b>Exogenous information:</b> annual third-party reporting to DIAN.</li>
    <li>Mandatory <b>e-invoicing</b>, support document for purchases from non-invoicers, electronic payroll and RADIAN for invoices as negotiable instruments.</li>
    <li><b>Form 2516</b> tax reconciliation, before the return.</li>
   </ul>
   <p><b>Comparison.</b> In Slovakia the corporate return is due three months after year-end (extendable), advance payments depend on the prior year's tax, and B2B e-invoicing becomes mandatory on 1 January 2027.</p>` },
  src: [["ET art. 807", ET("32")], ["Actualícese: plazos renta personas jurídicas 2026", "https://actualicese.com/plazos-para-declaracion-y-pago-de-impuesto-de-renta-personas-juridicas-2026/"], ["DIAN: conciliación fiscal", "https://www.dian.gov.co/Prensa/Paginas/NG-Publicados-prevalidadores-para-reporte-de-conciliacion-fiscal-AG-2025.aspx"], ["Podnikajte.sk: e-faktúra od 1.1.2027", "https://www.podnikajte.sk/pripravovane-zmeny-v-legislative/efaktura-od-1-1-2027-otazky-odpovede"]] },

{ t: { es: "Glosario Colombia - Eslovaquia", en: "Glossary Colombia - Slovakia" },
  b: {
   es: `<div class="scroll"><table><thead><tr><th>Colombia</th><th>Eslovaquia (SK)</th><th>Inglés</th></tr></thead><tbody>

   <tr><td>Conciliación fiscal</td><td>úprava výsledku hospodárenia na základ dane</td><td>Book-to-tax reconciliation</td></tr>

LEARN.splice(4, 0, { t: { es: "En trámite: proyecto de ley 477 de 2026", en: "Pending: bill 477 of 2026" },
  b: {
   es: `<p class="flag"><b>Es un proyecto, no una ley.</b> Se radicó en la Cámara de Representantes el 29 de octubre de 2026 («Ley de Rescate Económico», 106 artículos). A comienzos de noviembre de 2026 no había tenido primer debate, así que siguen vigentes las normas descritas en las demás secciones. El Congreso puede cambiarlo.</p>
   <ul>
    <li><b>Tarifa general:</b> de 35 % a 33 % en el año gravable 2027 y 31 % desde 2028.</li>
    <li><b>Entidades financieras y aseguradoras:</b> 5 puntos adicionales de 2027 a 2030 con renta líquida gravable de 120 000 UVT o más: 38 % en 2027 y 36 % de 2028 a 2030.</li>
    <li><b>Tasa mínima de tributación:</b> se limitaría a entidades de grupos multinacionales con ingresos consolidados de 750 millones de EUR o más, en línea con el Pilar Dos.</li>
    <li><b>IVA:</b> la tarifa general de 19 % no cambia; se amplía la base y desaparecería la tarifa del 5 % desde 2028.</li>
   </ul>
   <p><b>Por qué importa para esta clase.</b> Si se aprueba, Colombia pasaría de un piso que alcanza a casi todas las sociedades a uno solo para grandes grupos, y la mayoría volvería a estar sin piso, como entre 2021 y 2022. Es justamente la pregunta de diseño de la clase: ¿un piso para todas o solo para las más grandes?</p>
   <p class="note">Resumen tomado de análisis publicados del proyecto, no del texto oficial; verifique el texto y su estado antes de usarlo.</p>`,
   en: `<p class="flag"><b>This is a bill, not a law.</b> It was filed in the House of Representatives on 29 October 2026 ("Ley de Rescate Económico", 106 articles). In early November 2026 it had not had its first debate, so the rules described in the other sections remain in force. Congress may change it.</p>
   <ul>
    <li><b>General rate:</b> from 35 % to 33 % in tax year 2027 and 31 % from 2028.</li>
    <li><b>Financial and insurance entities:</b> 5 additional points from 2027 to 2030 with taxable income of 120,000 UVT or more: 38 % in 2027 and 36 % from 2028 to 2030.</li>
    <li><b>Minimum tax rate:</b> it would be limited to entities of multinational groups with consolidated income of EUR 750 million or more, in line with Pillar Two.</li>
    <li><b>VAT:</b> the 19 % standard rate does not change; the base widens and the 5 % rate would disappear from 2028.</li>
   </ul>
   <p><b>Why it matters for this lecture.</b> If approved, Colombia would move from a floor reaching almost all companies to one only for large groups, and most companies would again have no floor, as in 2021-2022. That is exactly the design question of the lecture: a floor for all, or only for the largest?</p>
   <p class="note">Summary taken from published analyses of the bill, not from the official text; check the text and its status before relying on it.</p>` },
  src: [["ANDI: resumen del PL 477", "https://www.andi.com.co/Uploads/Novedades%20-%20PL%20rescate%20fiscal.pdf"], ["Actualícese", "https://actualicese.com/implicaciones-del-proyecto-de-ley-de-rescate-economico-para-contadores-empresarios-y-contribuyentes/"], ["El Tiempo", "https://www.eltiempo.com/economia/sectores/ley-de-rescate-siete-de-cada-diez-pesos-saldrian-del-apreton-del-estado-quien-pagaria-mas-y-quien-recibiria-alivios-3597333"]] });
